name: Release 1.0

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Build CrossPointer (Release /MT)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 8

      - name: Create Packaged Folder and ZIP
        shell: pwsh
        run: |
          $pkgDir = "CrossPointer"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          Copy-Item "CrossPointer.exe" -Destination "$pkgDir\CrossPointer.exe"
          Copy-Item "README.md" -Destination "$pkgDir\README.md"
          
          # Add-Type for optimal zip compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($pkgDir, "CrossPointer.zip")

      - name: Upload Artifact Zip
        uses: actions/upload-artifact@v4
        with:
          name: CrossPointer
          path: .\CrossPointer.zip