name: Release 1.0

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Build Cross-pointer (Release /MT)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 8

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cross-pointer
          path: .\Cross-pointer.exe

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create v1.0 Cross-pointer.exe --title "Cross-pointer 1.0" --clobber --notes "### Cross-pointer 1.0 正式版 (macOS 26 设计美学版)`n`n- **全新 macOS 26 设计美学图标**：黑曜石磨砂玻璃 Squircle 圆角底座，内嵌高精度蔚蓝荧光十字标。`n- **极简蔚蓝半透明十字线**：默认采用 Apple Azure Blue (#007AFF) 搭配 70% 柔和透明度，清爽克制、低侵入感。`n- **1ms 硬件级高刷调度**：引入 \`timeBeginPeriod(1)\`，突破 Windows 默认 15.6ms 时钟限制，在 120Hz/144Hz 显示器上提供如 Apple ProMotion 般丝滑的跟随体验。`n- **纯绿色单文件**：纯 C++20 + Direct2D 原生静态编译 (/MT)，配置文件严格存放在同目录，不产生任何外部文件残留。"
