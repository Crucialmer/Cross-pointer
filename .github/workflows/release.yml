name: Release 1.0

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Build Cross-pointer (Release /MT)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 8

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cross-pointer
          path: .\Cross-pointer.exe

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create v1.0 Cross-pointer.exe --title "Cross-pointer 1.0" --notes "### Cross-pointer 1.0 正式版`n`n- 纯绿色单文件：Cross-pointer.exe`n- 零外溢残留：所有配置保存在程序同目录下，绝不向 AppData 或注册表写入任何文件。`n- 原生 C++20 + Direct2D：硬件加速，静态编译（/MT），免安装直接运行。"
